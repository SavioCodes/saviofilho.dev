<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Neural Network From Scratch social preview</title>
  <desc id="desc">Editorial social card for the neural network from scratch case with deterministic evaluation and reproducible logs.</desc>
  <defs>
    <linearGradient id="paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6eddf" />
      <stop offset="100%" stop-color="#e9dac3" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#paper)" />
  <rect x="38" y="38" width="1124" height="554" fill="none" stroke="#2b241d" stroke-width="2" />
  <rect x="72" y="74" width="235" height="34" rx="17" fill="#17342c" />
  <text x="190" y="96" text-anchor="middle" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="15" letter-spacing="1.6" fill="#f6eddf">PUBLIC REPOSITORY</text>
  <text x="72" y="172" font-family="'Newsreader', Georgia, serif" font-size="66" fill="#1f1812">Neural Network</text>
  <text x="72" y="228" font-family="'Newsreader', Georgia, serif" font-size="66" fill="#1f1812">From Scratch</text>
  <text x="72" y="286" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="28" fill="#41372d">Educational repo kept public because it proves deterministic evaluation,</text>
  <text x="72" y="322" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="28" fill="#41372d">portable logs, tests, and a rerunnable study pipeline.</text>
  <g transform="translate(72 390)">
    <rect width="510" height="134" fill="#f2e7d5" stroke="#2b241d" stroke-width="2" rx="18" />
    <text x="24" y="36" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="18" fill="#7a654f">INSPECT FIRST</text>
    <text x="24" y="76" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="31" font-weight="600" fill="#201913">evaluation seed / JSONL logs / smoke checks</text>
    <text x="24" y="110" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="22" fill="#4a4036">study repo, but engineered like a small reproducible system</text>
  </g>
  <g transform="translate(660 116)">
    <rect width="430" height="346" fill="#1a211d" rx="24" />
    <text x="28" y="42" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="18" fill="#c6b59f">REPRODUCIBILITY ROUTE</text>
    <g transform="translate(28 78)">
      <rect width="114" height="94" fill="#24302a" rx="14" />
      <text x="18" y="28" font-family="'IBM Plex Mono', monospace" font-size="13" fill="#89b09d">01</text>
      <text x="18" y="58" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="22" font-weight="600" fill="#f6eddf">Normalize</text>
      <text x="18" y="82" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="18" fill="#d2c4b4">dataset</text>
      <rect x="140" width="114" height="94" fill="#24302a" rx="14" />
      <text x="158" y="28" font-family="'IBM Plex Mono', monospace" font-size="13" fill="#89b09d">02</text>
      <text x="158" y="58" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="22" font-weight="600" fill="#f6eddf">Train</text>
      <text x="158" y="82" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="18" fill="#d2c4b4">from scratch</text>
      <rect x="280" width="122" height="94" fill="#24302a" rx="14" />
      <text x="298" y="28" font-family="'IBM Plex Mono', monospace" font-size="13" fill="#89b09d">03</text>
      <text x="298" y="58" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="22" font-weight="600" fill="#f6eddf">Evaluate</text>
      <text x="298" y="82" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="18" fill="#d2c4b4">and log</text>
    </g>
  </g>
  <g transform="translate(660 500)">
    <rect width="116" height="42" rx="21" fill="#efe3cf" />
    <text x="58" y="527" text-anchor="middle" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="17" fill="#201913">Python</text>
    <rect x="130" width="116" height="42" rx="21" fill="#efe3cf" />
    <text x="188" y="527" text-anchor="middle" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="17" fill="#201913">NumPy</text>
    <rect x="260" width="126" height="42" rx="21" fill="#efe3cf" />
    <text x="323" y="527" text-anchor="middle" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="17" fill="#201913">JSONL logs</text>
  </g>
</svg>
