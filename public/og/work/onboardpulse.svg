<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">OnboardPulse social preview</title>
  <desc id="desc">Editorial social card for OnboardPulse with onboarding SaaS, tenant isolation, billing, and follow-up workflow proof.</desc>
  <defs>
    <linearGradient id="paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6eddf" />
      <stop offset="100%" stop-color="#e9dac3" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#paper)" />
  <rect x="38" y="38" width="1124" height="554" fill="none" stroke="#2b241d" stroke-width="2" />
  <rect x="72" y="74" width="235" height="34" rx="17" fill="#17342c" />
  <text x="190" y="96" text-anchor="middle" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="15" letter-spacing="1.6" fill="#f6eddf">PUBLIC REPOSITORY</text>
  <text x="72" y="188" font-family="'Newsreader', Georgia, serif" font-size="76" fill="#1f1812">OnboardPulse</text>
  <text x="72" y="252" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="28" fill="#41372d">Multi-tenant onboarding SaaS with tenant scope, billing, uploads,</text>
  <text x="72" y="288" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="28" fill="#41372d">follow-up jobs, and AI budget edges that still read like product ops.</text>
  <g transform="translate(72 360)">
    <rect width="510" height="144" fill="#f2e7d5" stroke="#2b241d" stroke-width="2" rx="18" />
    <text x="24" y="36" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="18" fill="#7a654f">INSPECT FIRST</text>
    <text x="24" y="76" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="32" font-weight="600" fill="#201913">tenant boundary / billing replay / follow-up cron</text>
    <text x="24" y="116" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="22" fill="#4a4036">README, QA checklist, Vercel runbook, storage modes</text>
  </g>
  <g transform="translate(660 116)">
    <rect width="430" height="346" fill="#1a211d" rx="24" />
    <text x="28" y="42" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="18" fill="#c6b59f">OPERATING ROUTE</text>
    <g transform="translate(28 78)">
      <rect width="114" height="94" fill="#24302a" rx="14" />
      <text x="18" y="28" font-family="'IBM Plex Mono', monospace" font-size="13" fill="#89b09d">01</text>
      <text x="18" y="58" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="22" font-weight="600" fill="#f6eddf">Tenant</text>
      <text x="18" y="82" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="18" fill="#d2c4b4">scope</text>
      <rect x="140" width="114" height="94" fill="#24302a" rx="14" />
      <text x="158" y="28" font-family="'IBM Plex Mono', monospace" font-size="13" fill="#89b09d">02</text>
      <text x="158" y="58" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="22" font-weight="600" fill="#f6eddf">Billing</text>
      <text x="158" y="82" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="18" fill="#d2c4b4">webhook</text>
      <rect x="280" width="122" height="94" fill="#24302a" rx="14" />
      <text x="298" y="28" font-family="'IBM Plex Mono', monospace" font-size="13" fill="#89b09d">03</text>
      <text x="298" y="58" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="22" font-weight="600" fill="#f6eddf">Follow-up</text>
      <text x="298" y="82" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="18" fill="#d2c4b4">jobs</text>
    </g>
  </g>
  <g transform="translate(660 500)">
    <rect width="130" height="42" rx="21" fill="#efe3cf" />
    <text x="65" y="527" text-anchor="middle" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="17" fill="#201913">Next.js</text>
    <rect x="144" width="150" height="42" rx="21" fill="#efe3cf" />
    <text x="219" y="527" text-anchor="middle" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="17" fill="#201913">Mercado Pago</text>
    <rect x="308" width="144" height="42" rx="21" fill="#efe3cf" />
    <text x="380" y="527" text-anchor="middle" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="17" fill="#201913">Prisma</text>
  </g>
