<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Savio Filho portfolio social card</title>
  <desc id="desc">Editorial portfolio card with warm paper tones and engineering proof messaging.</desc>
  <defs>
    <linearGradient id="paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5ead8" />
      <stop offset="100%" stop-color="#eadbc3" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#paper)" />
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#2b241d" stroke-width="2" />
  <rect x="70" y="76" width="280" height="34" fill="#2b241d" rx="17" />
  <text x="210" y="99" text-anchor="middle" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="16" fill="#f5ead8" letter-spacing="1.8">SAVIO FILHO / PORTFOLIO</text>
  <text x="70" y="205" font-family="'Newsreader', Georgia, serif" font-size="68" fill="#201913">Backend product systems</text>
  <text x="70" y="278" font-family="'Newsreader', Georgia, serif" font-size="68" fill="#201913">with proof you can inspect.</text>
  <text x="70" y="352" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="28" fill="#3d352d">Case studies across SaaS, automation, billing flows, AI guardrails, and operational docs.</text>
  <g transform="translate(70 430)">
    <rect width="305" height="110" fill="#efe3cf" stroke="#2b241d" stroke-width="2" />
    <text x="24" y="34" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="18" fill="#6b5946">PUBLIC WORK</text>
    <text x="24" y="76" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="34" font-weight="600" fill="#201913">4 flagship repos</text>
  </g>
  <g transform="translate(410 430)">
    <rect width="305" height="110" fill="#efe3cf" stroke="#2b241d" stroke-width="2" />
    <text x="24" y="34" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="18" fill="#6b5946">PRIVATE CASES</text>
    <text x="24" y="76" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="34" font-weight="600" fill="#201913">Documented clearly</text>
  </g>
  <g transform="translate(750 430)">
    <rect width="340" height="110" fill="#2b241d" />
    <text x="26" y="34" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="18" fill="#cdb99e">FOCUS</text>
    <text x="26" y="72" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="30" font-weight="600" fill="#f5ead8">Billing / queues / AI limits</text>
  </g>
</svg>
